<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyOS Store</title>
    <style>
        :root { --accent: #30d158; --bg: #000; --card: #1c1c1e; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 50px; }
        .header { padding: 40px 20px; border-bottom: 0.5px solid #222; }
        .header h1 { margin: 0; font-size: 32px; font-weight: 800; }
        .header p { color: var(--accent); margin: 0; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
        .container { padding: 20px; }
        .app-card { background: var(--card); border-radius: 22px; padding: 15px; display: flex; align-items: center; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .app-icon { width: 60px; height: 60px; border-radius: 14px; margin-right: 15px; background: #333; }
        .app-info { flex: 1; }
        .app-info h3 { margin: 0; font-size: 16px; }
        .app-info p { margin: 2px 0 0; font-size: 11px; color: #8e8e93; }
        .btn-box { display: flex; flex-direction: column; gap: 6px; }
        .btn { padding: 8px 12px; border-radius: 15px; text-decoration: none; font-size: 11px; font-weight: bold; text-align: center; min-width: 80px; }
        .btn-install { background: var(--accent); color: #000; }
        .btn-ipa { background: #333; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="header">
    <p>MOBILE MOD HUB</p>
    <h1>HappyOS</h1>
</div>

<div class="container">
    <div class="app-card">
        <img class="app-icon" src="https://upload.wikimedia.org/wikipedia/en/c/c4/GTASABOX.jpg">
        <div class="app-info">
            <h3>GTA San Andreas</h3>
            <p>2.1 GB • Modded</p>
        </div>
        <div class="btn-box">
            <a href="itms-services://?action=download-manifest&url=https://usescarlet.com/manifest.plist" class="btn btn-install">INSTALL</a>
            <a href="https://ipa.ipasign.cc/ipa/gtasa.ipa" class="btn btn-ipa">GET IPA</a>
        </div>
    </div>

    <div class="app-card">
        <img class="app-icon" src="https://mc-pc.net/uploads/posts/2021-09/1632133271_minecraft-icon.png">
        <div class="app-info">
            <h3>Minecraft</h3>
            <p>320 MB • Full</p>
        </div>
        <div class="btn-box">
            <a href="itms-services://?action=download-manifest&url=https://usescarlet.com/manifest.plist" class="btn btn-install">INSTALL</a>
            <a href="https://ipa.ipasign.cc/ipa/minecraft.ipa" class="btn btn-ipa">GET IPA</a>
        </div>
    </div>
</div>

<div style="text-align:center; padding:20px; font-size:12px; color:var(--accent);">
    Tip: If "Install" fails, use "Get IPA"
</div>

</body>
</html>
