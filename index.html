<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyOS Store</title>
    <style>
        :root { --accent: #30d158; --bg: #000; --card: #1c1c1e; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; }
        .header { padding: 40px 20px; border-bottom: 0.5px solid #222; }
        .header h1 { margin: 0; font-size: 32px; }
        .container { padding: 20px; }
        .app-card { background: var(--card); border-radius: 20px; padding: 15px; display: flex; align-items: center; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .app-icon { width: 55px; height: 55px; border-radius: 12px; margin-right: 15px; }
        .app-info { flex: 1; }
        .app-info h3 { margin: 0; font-size: 16px; }
        .app-info p { margin: 2px 0 0; font-size: 11px; color: #8e8e93; }
        .get-btn { background: #2c2c2e; color: var(--accent); padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <p style="color:var(--accent); font-weight:bold; margin:0; font-size:12px;">HAPPYMOD FOR IOS</p>
    <h1>HappyOS</h1>
</div>

<div class="container">
    <div class="app-card">
        <img class="app-icon" src="https://is1-ssl.mzstatic.com/image/thumb/Purple123/v4/91/3c/6e/913c6e4e-09a1-09a8-e7c6-2c9339e72844/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-0.png/1200x630wa.png">
        <div class="app-info">
            <h3>GTA San Andreas</h3>
            <p>2.1 GB • Working Mod</p>
        </div>
        <a href="https://ipa.ipasign.cc/ipa/gtasa.ipa" class="get-btn">DOWNLOAD</a>
    </div>

    <div class="app-card">
        <img class="app-icon" src="https://mc-pc.net/uploads/posts/2021-09/1632133271_minecraft-icon.png">
        <div class="app-info">
            <h3>Minecraft</h3>
            <p>240 MB • Latest</p>
        </div>
        <a href="https://ipa.ipasign.cc/ipa/minecraft.ipa" class="get-btn">DOWNLOAD</a>
    </div>

    <div class="app-card">
        <div class="app-icon" style="background:#ff3b30;"></div>
        <div class="app-info">
            <h3>Scarlet Installer</h3>
            <p>Essential for HappyOS</p>
        </div>
        <a href="https://usescarlet.com/install" class="get-btn">INSTALL</a>
    </div>
</div>

<div style="text-align:center; color:#333; font-size:10px; padding:20px;">
    HAPPYOS ENGINE v2.0
</div>

</body>
</html>
