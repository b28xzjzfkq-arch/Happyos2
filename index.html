<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyOS | هابي أوس</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header { padding: 20px; border-bottom: 2px solid #30d158; margin-bottom: 20px; }
        .game-card { background: #1c1c1e; padding: 15px; border-radius: 20px; border: 1px solid #333; margin: 10px auto; max-width: 300px; }
        .btn { background: #30d158; color: black; padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; cursor: pointer; }
        /* تصميم صفحة التثبيت المخفية */
        #installer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; padding-top: 50px; }
    </style>
</head>
<body>

    <div id="store-ui">
        <div class="header">
            <h1>HappyOS 🍏</h1>
            <p>متجر المبدع B28xzjzfkq</p>
        </div>

        <div class="game-card">
            <h3>FNAF 1</h3>
            <p>نسخة كاملة - محصنة</p>
            <button onclick="startInstall('aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0IyOHhqempma3EtYXJjaC9IYXBweW9zL21haW4vZm5hZi5wbGlzdA==')" class="btn">تثبيت آمن</button>
        </div>
    </div>

    <div id="installer">
        <h2 style="color: #30d158;">🔒 مُثبت HappyOS</h2>
        <p>جاري فك تشفير الملف والتحقق من الشهادة...</p>
        <div style="border: 4px solid #333; border-top: 4px solid #30d158; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto;"></div>
        <p id="status">انتظر قليلاً...</p>
        <a id="final-link" href="#" class="btn" style="display:none;">تثبيت الآن 🚀</a>
    </div>

    <script>
        function startInstall(encodedLink) {
            document.getElementById('store-ui').style.display = 'none';
            document.getElementById('installer').style.display = 'block';

            setTimeout(() => {
                const decoded = atob(encodedLink);
                const itmsLink = "itms-services://?action=download-manifest&url=" + decoded;
                
                document.getElementById('status').innerText = "تم التحقق! الرابط جاهز.";
                const btn = document.getElementById('final-link');
                btn.href = itmsLink;
                btn.style.display = 'inline-block';
            }, 2500);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </script>
</body>
</html>
