<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyOS Store</title>
    <style>
        :root { --accent: #30d158; --bg: #000; --card: #1c1c1e; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; }
        .header { text-align: center; padding: 30px 0; border-bottom: 1px solid #222; margin-bottom: 20px; }
        .header h1 { font-size: 35px; margin: 0; font-weight: 900; }
        .header p { color: var(--accent); font-weight: bold; font-size: 12px; letter-spacing: 2px; }
        
        .app-card { background: var(--card); border-radius: 20px; padding: 20px; display: flex; align-items: center; margin-bottom: 15px; border: 1px solid #333; }
        .app-icon { width: 60px; height: 60px; border-radius: 15px; margin-right: 15px; background: #444; }
        .app-info { flex: 1; }
        .app-info h3 { margin: 0; font-size: 18px; }
        .app-info p { margin: 5px 0 0; font-size: 12px; color: #888; }
        
        .download-btn { background: var(--accent); color: #000; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .download-btn:active { transform: scale(0.9); background: #28b54c; }
    </style>
</head>
<body>

    <div class="header">
        <p>IOS MOD HUB</p>
        <h1>HappyOS</h1>
    </div>

    <div class="container">
        <div class="app-card">
            <div class="app-icon" style="background: url('https://upload.wikimedia.org/wikipedia/en/c/c4/GTASABOX.jpg') center/cover;"></div>
            <div class="app-info">
                <h3>GTA San Andreas</h3>
                <p>Mod Menu • 2.1 GB</p>
            </div>
            <a href="https://ipa.ipasign.cc/ipa/gtasa.ipa" target="_blank" class="download-btn">DOWNLOAD</a>
        </div>

        <div class="app-card">
            <div class="app-icon" style="background: url('https://mc-pc.net/uploads/posts/2021-09/1632133271_minecraft-icon.png') center/cover;"></div>
            <div class="app-info">
                <h3>Minecraft</h3>
                <p>Latest Version • 320 MB</p>
            </div>
            <a href="https://ipa.ipasign.cc/ipa/minecraft.ipa" target="_blank" class="download-btn">DOWNLOAD</a>
        </div>
    </div>

    <div style="margin-top: 30px; text-align: center; color: #555; font-size: 12px;">
        <p>Step 1: Download IPA</p>
        <p>Step 2: Install via Scarlet or ESign</p>
    </div>

</body>
</html>
