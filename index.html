<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyOS Store</title>
    <style>
        :root { --accent: #30d158; --bg: #000; --card: #1c1c1e; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; }
        .header { padding: 40px 20px; border-bottom: 0.5px solid #222; }
        .header h1 { margin: 0; font-size: 32px; font-weight: 800; }
        .header p { color: var(--accent); margin: 0; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
        .container { padding: 20px; }
        .app-card { background: var(--card); border-radius: 22px; padding: 18px; display: flex; align-items: center; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .app-icon { width: 60px; height: 60px; border-radius: 14px; margin-right: 15px; background: #333; }
        .app-info { flex: 1; }
        .app-info h3 { margin: 0; font-size: 17px; }
        .app-info p { margin: 3px 0 0; font-size: 12px; color: #8e8e93; }
        .install-btn { background: var(--accent); color: #000; padding: 10px 22px; border-radius: 20px; text-decoration: none; font-weight: 800; font-size: 13px; transition: 0.2s; }
        .install-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div class="header">
    <p>CERTIFIED MODS ONLY</p>
    <h1>HappyOS</h1>
</div>

<div class="container">
    <div class="app-card">
        <div class="app-icon" style="background: url('https://upload.wikimedia.org/wikipedia/en/c/c4/GTASABOX.jpg') center/cover;"></div>
        <div class="app-info">
            <h3>GTA San Andreas</h3>
            <p>Certified Download</p>
        </div>
        <a href="itms-services://?action=download-manifest&url=https://usescarlet.com/manifest.plist" class="install-btn">INSTALL</a>
    </div>

    <div class="app-card">
        <div class="app-icon" style="background: url('https://mc-pc.net/uploads/posts/2021-09/1632133271_minecraft-icon.png') center/cover;"></div>
        <div class="app-info">
            <h3>Minecraft</h3>
            <p>Premium Mod</p>
        </div>
        <a href="itms-services://?action=download-manifest&url=https://usescarlet.com/manifest.plist" class="install-btn">INSTALL</a>
    </div>
</div>

<div style="text-align:center; padding:40px; color:#444; font-size:10px; letter-spacing: 2px;">
    BY HAPPYOS TEAM
</div>

</body>
</html>
