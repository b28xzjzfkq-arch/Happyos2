<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyOS Store</title>
    <style>
        :root {
            --accent-color: #30d158;
            --bg-dark: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        .header {
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, #111 0%, #000 100%);
            border-bottom: 0.5px solid #2c2c2e;
        }

        .header p {
            color: var(--accent-color);
            margin: 0;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 5px 0 0;
        }

        .container {
            padding: 20px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 16px;
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            border: 1px solid #2c2c2e;
            transition: transform 0.2s;
        }

        .app-card:active {
            transform: scale(0.98);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #333;
            margin-right: 15px;
            object-fit: cover;
            border: 0.5px solid #444;
        }

        .app-info {
            flex-grow: 1;
        }

        .app-info h3 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
        }

        .app-info p {
            margin: 3px 0 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .get-btn {
            background: #2c2c2e;
            color: var(--accent-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            text-align: center;
            min-width: 60px;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #444;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <p>Premium Access</p>
        <h1>HappyOS Store</h1>
    </div>

    <div class="container">
        <div class="app-card">
            <div class="app-icon" style="background: #551a1a;"></div>
            <div class="app-info">
                <h3>FNAF 1</h3>
                <p>Version 2.0.4 • 50 MB</p>
            </div>
            <a href="fnaf.ipa" download class="get-btn">IPA</a>
        </div>

        <div class="app-card">
            <div class="app-icon" style="background: #2e5a27;"></div>
            <div class="app-info">
                <h3>Minecraft</h3>
                <p>Pocket Edition • 240 MB</p>
            </div>
            <a href="minecraft.ipa" download class="get-btn">IPA</a>
        </div>

        <div class="app-card">
            <div class="app-icon" style="background: #ff7f00;"></div>
            <div class="app-info">
                <h3>GTA San Andreas</h3>
                <p>Remastered • 2.1 GB</p>
            </div>
            <a href="gta.ipa" download class="get-btn">IPA</a>
        </div>

        <div class="app-card">
            <div class="app-icon" style="background: #e62117;"></div>
            <div class="app-info">
                <h3>Scarlet</h3>
                <p>System Tool • 15 MB</p>
            </div>
            <a href="scarlet.ipa" download class="get-btn">IPA</a>
        </div>
    </div>

    <div class="footer">
        © 2026 HappyOS Development
    </div>

</body>
</html>
